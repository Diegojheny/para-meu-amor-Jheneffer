<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para meu amor ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ffe4ee, #fff7fa);
            color: #861642;
            overflow-x: hidden;
        }

        /* =========================
           LOGIN
           ========================= */

        .login-screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(120, 20, 60, 0.18);
        }

        .login-heart {
            font-size: 65px;
            margin-bottom: 10px;
        }

        .login-box h1 {
            margin: 0;
            font-size: 32px;
        }

        .login-box p {
            color: #9b6378;
            margin: 12px 0 25px;
        }

        .login-box label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            border: 2px solid #efbfd0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .login-box input:focus {
            border-color: #ff4f87;
        }

        .login-box button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: none;
            border-radius: 12px;
            background: #ff4f87;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-box button:active {
            transform: scale(0.98);
        }

        #erro {
            min-height: 22px;
            margin-top: 12px;
            color: #c62857;
            font-weight: bold;
        }

        /* =========================
           TELA DO AMOR
           ========================= */

        .love-screen {
            display: none;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            background:
                radial-gradient(
                    circle at center,
                    #fff9fb 0%,
                    #ffeaf1 50%,
                    #ffd5e3 100%
                );
        }

        .love-screen.active {
            display: flex;
        }

        /* =========================
           CORAÇÃO
           ========================= */

        .heart-container {
            width: 330px;
            height: 330px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .heart {
            width: 175px;
            height: 175px;
            position: absolute;
            transform: rotate(-45deg);
            border-left: 8px solid #ff4f87;
            border-bottom: 8px solid #ff4f87;
            animation: pulsar 1.2s infinite;
            filter: drop-shadow(
                0 5px 15px rgba(255, 79, 135, 0.35)
            );
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 175px;
            height: 175px;
            border: 8px solid #ff4f87;
            border-radius: 50%;
        }

        .heart::before {
            top: -92px;
            left: -8px;
            border-bottom: none;
        }

        .heart::after {
            top: 0;
            left: 92px;
            border-left: none;
        }

        @keyframes pulsar {

            0% {
                transform: rotate(-45deg) scale(1);
            }

            15% {
                transform: rotate(-45deg) scale(1.12);
            }

            30% {
                transform: rotate(-45deg) scale(1);
            }

            45% {
                transform: rotate(-45deg) scale(1.08);
            }

            60% {
                transform: rotate(-45deg) scale(1);
            }

            100% {
                transform: rotate(-45deg) scale(1);
            }
        }

        .heart-text {
            position: relative;
            z-index: 2;
            font-size: 35px;
            font-weight: 900;
            line-height: 1.1;
            color: #8f1747;
        }

        /* =========================
           FRASES
           ========================= */

        .love-message {
            max-width: 900px;
            margin: 0;
            padding: 0 20px;
            font-size: clamp(30px, 6vw, 55px);
            font-weight: 900;
            line-height: 1.1;
            color: #8f1747;
        }

        .small-message {
            margin-top: 20px;
            font-size: 19px;
            color: #a15370;
        }

        /* =========================
           CORAÇÕES FLUTUANDO
           ========================= */

        .floating-heart {
            position: absolute;
            bottom: -60px;
            font-size: 28px;
            color: #ff6f9d;
            opacity: 0;
            animation: subir 7s linear infinite;
            pointer-events: none;
        }

        .heart1 {
            left: 10%;
            animation-delay: 0s;
        }

        .heart2 {
            left: 30%;
            animation-delay: 2s;
        }

        .heart3 {
            left: 65%;
            animation-delay: 1s;
        }

        .heart4 {
            left: 85%;
            animation-delay: 3.5s;
        }

        @keyframes subir {

            0% {
                transform: translateY(0) scale(0.7);
                opacity: 0;
            }

            20% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(-110vh) scale(1.4);
                opacity: 0;
            }
        }

        /* =========================
           CELULAR
           ========================= */

        @media (max-width: 600px) {

            .login-box {
                padding: 35px 25px;
            }

            .login-box h1 {
                font-size: 28px;
            }

            .heart-container {
                width: 290px;
                height: 290px;
            }

            .heart {
                width: 145px;
                height: 145px;
            }

            .heart::before,
            .heart::after {
                width: 145px;
                height: 145px;
            }

            .heart::before {
                top: -77px;
            }

            .heart::after {
                left: 77px;
            }

            .heart-text {
                font-size: 29px;
            }

            .love-message {
                font-size: 34px;
            }

            .small-message {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         TELA DE LOGIN
         ========================= -->

    <section class="login-screen" id="loginScreen">

        <div class="login-box">

            <div class="login-heart">
                ❤️
            </div>

            <h1>
                Uma surpresa para você
            </h1>

            <p>
                Digite seu usuário e senha para entrar 💕
            </p>

            <form id="loginForm">

                <label for="usuario">
                    Usuário
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Digite seu usuário"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Entrar ❤️
                </button>

                <div id="erro"></div>

            </form>

        </div>

    </section>


    <!-- =========================
         TELA DE AMOR
         ========================= -->

    <section class="love-screen" id="loveScreen">

        <div class="floating-heart heart1">
            ♥
        </div>

        <div class="floating-heart heart2">
            ♡
        </div>

        <div class="floating-heart heart3">
            ♥
        </div>

        <div class="floating-heart heart4">
            ♡
        </div>


        <div class="heart-container">

            <div class="heart"></div>

            <div class="heart-text">
                EU AMO<br>
                VOCÊ ❤️
            </div>

        </div>


        <p class="love-message">
            Você me faz feliz todos os dias.
        </p>

        <p class="small-message">
            E eu escolheria você de novo, todos os dias. 💕
        </p>

    </section>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginScreen =
            document.getElementById("loginScreen");

        const loveScreen =
            document.getElementById("loveScreen");

        const erro =
            document.getElementById("erro");


        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();


            const usuario =
                document.getElementById("usuario").value;

            const senha =
                document.getElementById("senha").value;


            const usuarioCorreto =
                "Jheneffer";

            const senhaCorreta =
                "Energisa@2021";


            if (
                usuario === usuarioCorreto &&
                senha === senhaCorreta
            ) {

                loginScreen.style.display = "none";

                loveScreen.classList.add("active");

            } else {

                erro.textContent =
                    "Usuário ou senha incorretos ❤️";

            }

        });

    </script>

</body>
</html>
