<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para o meu amor ❤️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    background: #120009;
}

/* ==============================
   LOGIN
================================ */

#loginScreen {

    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at center, #4d0b29, #16000c 70%);

    padding: 25px;
}

.loginBox {

    width: 100%;
    max-width: 420px;

    padding: 40px 30px;

    text-align: center;

    border-radius: 30px;

    background: rgba(255,255,255,0.08);

    backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.18);

    box-shadow:
        0 0 40px rgba(255,40,120,0.25),
        inset 0 0 30px rgba(255,255,255,0.03);

    color: white;
}

.loginHeart {

    font-size: 70px;

    animation:
        loginPulse 1.3s infinite;

    margin-bottom: 15px;

    filter:
        drop-shadow(0 0 20px #ff4d8d);
}

@keyframes loginPulse {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}

.loginBox h1 {

    font-size: 30px;
    margin-bottom: 10px;

}

.loginBox p {

    color: #ffc1d8;
    margin-bottom: 30px;

}

.loginBox label {

    display: block;

    text-align: left;

    margin: 15px 0 7px;

    color: #ffd5e4;

    font-weight: bold;

}

.loginBox input {

    width: 100%;

    padding: 15px;

    border-radius: 15px;

    border: 1px solid rgba(255,255,255,0.25);

    background: rgba(0,0,0,0.25);

    color: white;

    font-size: 16px;

    outline: none;

}

.loginBox input:focus {

    border-color: #ff4f91;

    box-shadow:
        0 0 15px rgba(255,79,145,0.35);

}

.loginBox button {

    width: 100%;

    margin-top: 25px;

    padding: 16px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(135deg,#ff3f82,#ff75a7);

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(255,50,120,0.35);

    transition: 0.25s;

}

.loginBox button:hover {

    transform: translateY(-2px) scale(1.02);

}

#erro {

    margin-top: 12px;

    color: #ff9bbb;

    min-height: 20px;

}


/* ==============================
   TELA PRINCIPAL
================================ */

#loveScreen {

    display: none;

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    color: white;

    background:

        radial-gradient(
            circle at 50% 45%,
            #5b1235 0%,
            #290619 35%,
            #100007 75%
        );

}


/* brilho central */

.glow {

    position: absolute;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 45%;

    transform: translate(-50%,-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,60,130,0.18),
            transparent 70%
        );

    filter: blur(20px);

    animation: glowPulse 2.5s infinite;

}

@keyframes glowPulse {

    0%,100% {
        transform: translate(-50%,-50%) scale(0.9);
        opacity: .6;
    }

    50% {
        transform: translate(-50%,-50%) scale(1.2);
        opacity: 1;
    }

}


/* ==============================
   CORAÇÃO
================================ */

.heartArea {

    position: absolute;

    left: 50%;
    top: 43%;

    transform: translate(-50%,-50%);

    width: 350px;
    height: 350px;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;

    z-index: 5;

}


/* coração externo */

.heart {

    position: relative;

    width: 180px;
    height: 180px;

    transform: rotate(-45deg);

    border-left: 7px solid #ff4d91;
    border-bottom: 7px solid #ff4d91;

    animation:

        heartBeat 1.8s infinite,

        heartFloat 4s ease-in-out infinite;

    filter:

        drop-shadow(0 0 8px #ff4d91)
        drop-shadow(0 0 25px rgba(255,50,130,.7));

    transition: .25s;

}


/* círculos do coração */

.heart::before,
.heart::after {

    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    border: 7px solid #ff4d91;

    border-radius: 50%;

}

.heart::before {

    top: -94px;
    left: -7px;

    border-bottom: none;

}

.heart::after {

    top: 0;
    left: 94px;

    border-left: none;

}


/* pulsação */

@keyframes heartBeat {

    0%,100% {

        transform:
            rotate(-45deg)
            scale(1);

    }

    8% {

        transform:
            rotate(-45deg)
            scale(1.12);

    }

    16% {

        transform:
            rotate(-45deg)
            scale(1);

    }

    24% {

        transform:
            rotate(-45deg)
            scale(1.08);

    }

    34% {

        transform:
            rotate(-45deg)
            scale(1);

    }

}


/* balanço */

@keyframes heartFloat {

    0%,100% {

        margin-top: 0;

    }

    50% {

        margin-top: -12px;

    }

}


/* interação */

.heartArea:hover .heart {

    filter:

        drop-shadow(0 0 15px #ff4d91)
        drop-shadow(0 0 50px #ff4d91);

    transform:
        rotate(-45deg)
        scale(1.12);

}


/* ==============================
   TEXTO DENTRO
================================ */

.insideText {

    position: absolute;

    z-index: 10;

    text-align: center;

    color: #fff;

    font-size: 28px;

    font-weight: 900;

    line-height: 1.1;

    text-shadow:

        0 0 10px #ff4d91,
        0 0 25px rgba(255,70,140,.8);

    pointer-events: none;

}


/* ==============================
   MENSAGEM
================================ */

.message {

    position: absolute;

    top: 75%;

    width: 100%;

    text-align: center;

    padding: 0 20px;

    z-index: 5;

    animation: messageAppear 2s ease forwards;

}

.message h1 {

    font-size: clamp(30px,6vw,60px);

    color: white;

    text-shadow:

        0 0 10px #ff4d91,
        0 0 30px rgba(255,70,140,.6);

}

.message p {

    margin-top: 15px;

    font-size: 20px;

    color: #ffc7da;

}

@keyframes messageAppear {

    from {

        opacity: 0;
        transform: translateY(30px);

    }

    to {

        opacity: 1;
        transform: translateY(0);

    }

}


/* ==============================
   CORAÇÕES FLUTUANTES
================================ */

.floatingHeart {

    position: absolute;

    bottom: -50px;

    color: #ff5c9b;

    font-size: 25px;

    pointer-events: none;

    opacity: 0;

    animation: floating 8s linear infinite;

    text-shadow:
        0 0 10px #ff4d91;

}

@keyframes floating {

    0% {

        transform:
            translateY(0)
            scale(.6)
            rotate(0deg);

        opacity: 0;

    }

    15% {

        opacity: .8;

    }

    100% {

        transform:
            translateY(-110vh)
            scale(1.5)
            rotate(25deg);

        opacity: 0;

    }

}


/* posições */

.f1 {
    left: 8%;
    animation-delay: 0s;
}

.f2 {
    left: 20%;
    animation-delay: 2s;
}

.f3 {
    left: 35%;
    animation-delay: 4s;
}

.f4 {
    left: 55%;
    animation-delay: 1s;
}

.f5 {
    left: 70%;
    animation-delay: 3s;
}

.f6 {
    left: 88%;
    animation-delay: 5s;
}


/* ==============================
   EXPLOSÃO DE CORAÇÕES
================================ */

.burst {

    position: absolute;

    left: 50%;
    top: 43%;

    pointer-events: none;

    font-size: 25px;

    z-index: 20;

    animation: burst 1.2s forwards;

}

@keyframes burst {

    0% {

        transform:
            translate(-50%,-50%)
            scale(.2);

        opacity: 1;

    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.3);

        opacity: 0;

    }

}


/* ==============================
   CELULAR
================================ */

@media(max-width:600px) {

    .heartArea {

        width: 290px;
        height: 290px;

    }

    .heart {

        width: 145px;
        height: 145px;

    }

    .heart::before,
    .heart::after {

        width: 145px;
        height: 145px;

    }

    .heart::before {

        top: -77px;

    }

    .heart::after {

        left: 77px;

    }

    .insideText {

        font-size: 24px;

    }

    .message {

        top: 73%;

    }

    .message h1 {

        font-size: 34px;

    }

    .message p {

        font-size: 16px;

    }

}

</style>
</head>


<body>


<!-- ==============================
     LOGIN
================================ -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="loginHeart">
            ❤️
        </div>

        <h1>
            Uma surpresa para você
        </h1>

        <p>
            Só você pode entrar aqui... 💕
        </p>


        <form id="loginForm">

            <label>
                Usuário
            </label>

            <input
                type="text"
                id="usuario"
                placeholder="Seu nome"
                required
            >


            <label>
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Uma palavrinha especial..."
                required
            >


            <button type="submit">
                Entrar no meu coração ❤️
            </button>

            <div id="erro"></div>

        </form>

    </div>

</div>



<!-- ==============================
     SURPRESA
================================ -->

<div id="loveScreen">

    <div class="glow"></div>


    <!-- corações flutuantes -->

    <div class="floatingHeart f1">♥</div>
    <div class="floatingHeart f2">♡</div>
    <div class="floatingHeart f3">♥</div>
    <div class="floatingHeart f4">♡</div>
    <div class="floatingHeart f5">♥</div>
    <div class="floatingHeart f6">♡</div>


    <!-- coração -->

    <div class="heartArea" id="heartArea">

        <div class="heart"></div>

        <div class="insideText">

            EU<br>
            TE AMO ❤️

        </div>

    </div>


    <!-- mensagem -->

    <div class="message">

        <h1>
            Eu amo você.
        </h1>

        <p>
            Você me faz feliz todos os dias. ❤️
        </p>

    </div>

</div>



<script>


/* ==============================
   LOGIN
================================ */

const form =
    document.getElementById("loginForm");

const loginScreen =
    document.getElementById("loginScreen");

const loveScreen =
    document.getElementById("loveScreen");

const erro =
    document.getElementById("erro");


form.addEventListener("submit", function(event) {

    event.preventDefault();


    const usuario =
        document.getElementById("usuario").value.trim();

    const senha =
        document.getElementById("senha").value;


    if (
        usuario === "Jheneffer" &&
        senha === "eu te amo"
    ) {

        loginScreen.style.display = "none";

        loveScreen.style.display = "block";

        criarCoracoes();

    } else {

        erro.textContent =
            "Hmm... acho que você errou ❤️";

    }

});



/* ==============================
   CORAÇÕES EXTRAS
================================ */

function criarCoracoes() {

    for (let i = 0; i < 18; i++) {

        const heart =
            document.createElement("div");

        heart.className = "floatingHeart";

        heart.innerHTML =
            Math.random() > .5 ? "♥" : "♡";

        heart.style.left =
            Math.random() * 100 + "%";

        heart.style.fontSize =
            (15 + Math.random() * 30) + "px";

        heart.style.animationDuration =
            (5 + Math.random() * 7) + "s";

        heart.style.animationDelay =
            Math.random() * 6 + "s";

        loveScreen.appendChild(heart);

    }

}



/* ==============================
   CORAÇÃO INTERATIVO
================================ */

const heartArea =
    document.getElementById("heartArea");


heartArea.addEventListener("click", function(event) {

    for (let i = 0; i < 16; i++) {

        const heart =
            document.createElement("div");

        heart.className = "burst";

        heart.innerHTML =
            Math.random() > .5 ? "❤️" : "💗";


        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            100 + Math.random() * 180;


        heart.style.setProperty(
            "--x",
            Math.cos(angle) * distance + "px"
        );


        heart.style.setProperty(
            "--y",
            Math.sin(angle) * distance + "px"
        );


        loveScreen.appendChild(heart);


        setTimeout(function() {

            heart.remove();

        }, 1200);

    }

});



/* ==============================
   MOVIMENTO COM O CELULAR / MOUSE
================================ */

document.addEventListener("mousemove", function(event) {

    if (loveScreen.style.display !== "block")
        return;


    const x =
        (event.clientX / window.innerWidth - .5) * 12;

    const y =
        (event.clientY / window.innerHeight - .5) * 12;


    heartArea.style.marginLeft = x + "px";

    heartArea.style.marginTop = y + "px";

});


</script>


</body>
</html>
