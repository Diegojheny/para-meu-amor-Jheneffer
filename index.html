<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para o meu amor ❤️</title>

<style>

/* ================================
   CONFIGURAÇÕES GERAIS
================================ */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}


/* ================================
   LOGIN
================================ */

#loginScreen {

    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;

    background:
        radial-gradient(
            circle at 50% 40%,
            #5e1038 0%,
            #260717 38%,
            #0b0207 100%
        );

    color: white;
}

.loginBox {

    width: 100%;
    max-width: 410px;

    padding: 42px 30px;

    text-align: center;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.035)
        );

    border: 1px solid rgba(255,255,255,.18);

    backdrop-filter: blur(18px);

    box-shadow:
        0 0 40px rgba(255,40,120,.22),
        inset 0 0 30px rgba(255,255,255,.035);
}

.loginHeart {

    font-size: 70px;

    margin-bottom: 15px;

    animation: loginBeat 1.4s infinite;

    filter:
        drop-shadow(0 0 10px #ff3f86)
        drop-shadow(0 0 30px #ff3f86);
}

@keyframes loginBeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.16);
    }
}

.loginBox h1 {

    font-size: 30px;
    margin-bottom: 10px;

}

.loginBox p {

    color: #ffc1d9;

    margin-bottom: 28px;

}

.loginBox label {

    display: block;

    text-align: left;

    margin: 15px 0 7px;

    color: #ffd9e6;

    font-weight: bold;

}

.loginBox input {

    width: 100%;

    padding: 15px;

    border-radius: 14px;

    border: 1px solid rgba(255,255,255,.2);

    background: rgba(0,0,0,.25);

    color: white;

    font-size: 16px;

    outline: none;

}

.loginBox input:focus {

    border-color: #ff4c92;

    box-shadow:
        0 0 18px rgba(255,76,146,.35);

}

.loginBox button {

    width: 100%;

    padding: 16px;

    margin-top: 24px;

    border: none;

    border-radius: 15px;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #ff397e,
            #ff69a1,
            #d93cff
        );

    background-size: 200% 200%;

    animation: buttonGradient 4s ease infinite;

    box-shadow:
        0 8px 30px rgba(255,45,120,.35);

    transition: .25s;
}

@keyframes buttonGradient {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

.loginBox button:active {

    transform: scale(.97);

}

#erro {

    min-height: 20px;

    margin-top: 12px;

    color: #ff9abb;

}


/* ================================
   TELA DO AMOR
================================ */

#loveScreen {

    display: none;

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 50% 43%,
            #68153d 0%,
            #35091f 28%,
            #18030e 62%,
            #070105 100%
        );

    color: white;
}


/* ================================
   BRILHO CENTRAL
================================ */

.centerGlow {

    position: absolute;

    width: 650px;
    height: 650px;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,30,120,.25) 0%,
            rgba(190,30,130,.12) 30%,
            transparent 70%
        );

    filter: blur(20px);

    animation: centerGlow 3s ease-in-out infinite;

}

@keyframes centerGlow {

    0%,100% {

        transform:
            translate(-50%, -50%)
            scale(.85);

        opacity: .55;

    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.15);

        opacity: 1;

    }
}


/* ================================
   ÁREA DO CORAÇÃO
================================ */

.heartArea {

    position: absolute;

    left: 50%;
    top: 43%;

    width: min(90vw, 470px);
    height: min(90vw, 470px);

    transform: translate(-50%, -50%);

    display: flex;

    justify-content: center;
    align-items: center;

    cursor: pointer;

    z-index: 10;

    animation: floatingHeart 5s ease-in-out infinite;

}

@keyframes floatingHeart {

    0%,100% {

        transform:
            translate(-50%, -50%)
            translateY(0);

    }

    50% {

        transform:
            translate(-50%, -50%)
            translateY(-12px);

    }
}


/* ================================
   SVG
================================ */

.heartSvg {

    width: 100%;
    height: 100%;

    overflow: visible;

}


/* ================================
   DEGRADÊ DO CORAÇÃO
================================ */

#heartGradient {

    animation:
        gradientMove 4s linear infinite;

}

@keyframes gradientMove {

    0% {
        stop-color: #ff2f7d;
    }

    35% {
        stop-color: #ff6ca8;
    }

    65% {
        stop-color: #d948ff;
    }

    100% {
        stop-color: #ff2f7d;
    }

}


/* ================================
   FILTRO DE BRILHO
================================ */

.neonGlow {

    filter:
        url(#glow)
        drop-shadow(0 0 10px #ff3f8b)
        drop-shadow(0 0 25px #ff3f8b)
        drop-shadow(0 0 50px rgba(255,50,140,.9));

}


/* ================================
   CONTORNO PRINCIPAL
================================ */

.heartOutline {

    fill: none;

    stroke: url(#heartGradient);

    stroke-width: 10;

    stroke-linecap: round;
    stroke-linejoin: round;

    stroke-dasharray: 1500;

    stroke-dashoffset: 1500;

    animation:
        drawHeart 3.2s cubic-bezier(.65,0,.25,1) forwards,
        heartPulse 2.1s 3.2s ease-in-out infinite;

}


/* coração sendo desenhado */

@keyframes drawHeart {

    0% {

        stroke-dashoffset: 1500;

    }

    100% {

        stroke-dashoffset: 0;

    }

}


/* pulsação */

@keyframes heartPulse {

    0%,100% {

        transform:
            translate(0,0)
            scale(1);

    }

    8% {

        transform:
            translate(0,0)
            scale(1.035);

    }

    17% {

        transform:
            translate(0,0)
            scale(1);

    }

    25% {

        transform:
            translate(0,0)
            scale(1.022);

    }

    35% {

        transform:
            translate(0,0)
            scale(1);

    }

}


/* ================================
   PREENCHIMENTO APARECENDO
================================ */

.heartFill {

    fill: url(#fillGradient);

    opacity: 0;

    transform-origin: center;

    animation:
        fillHeart 2s 2.4s ease forwards;

}

@keyframes fillHeart {

    0% {

        opacity: 0;

        transform: scale(.82);

    }

    100% {

        opacity: .12;

        transform: scale(1);

    }

}


/* ================================
   SEGUNDO CONTORNO
================================ */

.heartInner {

    fill: none;

    stroke: rgba(255,170,215,.65);

    stroke-width: 2;

    stroke-dasharray: 8 12;

    opacity: 0;

    animation:
        innerAppear 2s 2.7s ease forwards,
        innerRotate 12s 2.7s linear infinite;

}

@keyframes innerAppear {

    to {
        opacity: .75;
    }

}

@keyframes innerRotate {

    to {
        stroke-dashoffset: -100;
    }

}


/* ================================
   TEXTO
================================ */

.insideText {

    position: absolute;

    z-index: 20;

    text-align: center;

    pointer-events: none;

    opacity: 0;

    animation:
        textAppear 2s 2.9s ease forwards;

}

.insideText .small {

    display: block;

    font-size: 20px;

    letter-spacing: 5px;

    color: #ffd7e8;

    margin-bottom: 6px;

}

.insideText .big {

    display: block;

    font-size: clamp(30px, 8vw, 50px);

    font-weight: 900;

    line-height: .95;

    color: white;

    text-shadow:
        0 0 8px #ff4f91,
        0 0 20px #ff4f91,
        0 0 40px rgba(255,60,140,.8);

}

@keyframes textAppear {

    from {

        opacity: 0;

        transform: scale(.7);

    }

    to {

        opacity: 1;

        transform: scale(1);

    }

}


/* ================================
   MENSAGEM
================================ */

.message {

    position: absolute;

    width: 100%;

    left: 0;

    top: 75%;

    padding: 0 20px;

    text-align: center;

    z-index: 15;

    opacity: 0;

    animation:
        messageAppear 2s 3.5s ease forwards;

}

.message h1 {

    font-size:
        clamp(32px, 7vw, 62px);

    font-weight: 900;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffb5d2,
            #ffffff,
            #e9aaff
        );

    background-size: 250% auto;

    color: transparent;

    background-clip: text;

    -webkit-background-clip: text;

    animation:
        textGradient 5s linear infinite;

    text-shadow:
        0 0 25px rgba(255,80,160,.25);

}

.message p {

    margin-top: 14px;

    color: #ffc7da;

    font-size:
        clamp(16px, 4vw, 21px);

}

@keyframes messageAppear {

    from {

        opacity: 0;

        transform:
            translateY(35px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}

@keyframes textGradient {

    to {
        background-position: 250% center;
    }

}


/* ================================
   PARTÍCULAS
================================ */

.spark {

    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px #ff6fa9,
        0 0 16px #ff6fa9;

    opacity: 0;

    animation: sparkle 3s infinite;

}

@keyframes sparkle {

    0%,100% {

        opacity: 0;

        transform: scale(.3);

    }

    50% {

        opacity: 1;

        transform: scale(1.5);

    }

}


/* ================================
   CORAÇÕES FLUTUANTES
================================ */

.floating {

    position: absolute;

    bottom: -60px;

    color: #ff5b9d;

    font-size: 25px;

    opacity: 0;

    pointer-events: none;

    text-shadow:
        0 0 10px #ff3f8c,
        0 0 25px #ff3f8c;

    animation: rise 8s linear infinite;

}

@keyframes rise {

    0% {

        transform:
            translateY(0)
            scale(.5)
            rotate(0deg);

        opacity: 0;

    }

    15% {

        opacity: .8;

    }

    100% {

        transform:
            translateY(-115vh)
            scale(1.5)
            rotate(35deg);

        opacity: 0;

    }

}


/* ================================
   EXPLOSÃO
================================ */

.burst {

    position: absolute;

    left: 50%;
    top: 43%;

    z-index: 100;

    pointer-events: none;

    font-size: 25px;

    animation:
        burstAnimation 1.4s ease-out forwards;

}

@keyframes burstAnimation {

    0% {

        transform:
            translate(-50%,-50%)
            scale(.2)
            rotate(0deg);

        opacity: 1;

    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.4)
            rotate(180deg);

        opacity: 0;

    }

}


/* ================================
   ONDA AO TOCAR
================================ */

.ripple {

    position: absolute;

    left: 50%;
    top: 43%;

    width: 80px;
    height: 80px;

    border: 2px solid #ff6ca8;

    border-radius: 50%;

    transform:
        translate(-50%,-50%)
        scale(.3);

    pointer-events: none;

    z-index: 8;

    animation:
        rippleAnimation 1.2s ease-out forwards;

}

@keyframes rippleAnimation {

    to {

        transform:
            translate(-50%,-50%)
            scale(6);

        opacity: 0;

    }

}


/* ================================
   CELULAR
================================ */

@media(max-width:600px) {

    .heartArea {

        width: 92vw;
        height: 92vw;

        top: 42%;

    }

    .message {

        top: 72%;

    }

    .message h1 {

        font-size: 34px;

    }

    .message p {

        font-size: 16px;

    }

    .insideText .small {

        font-size: 15px;

        letter-spacing: 3px;

    }

}

</style>
</head>


<body>


<!-- ==================================
     LOGIN
================================== -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="loginHeart">
            ❤️
        </div>

        <h1>
            Uma surpresa para você
        </h1>

        <p>
            Só existe uma pessoa que pode entrar aqui... 💕
        </p>


        <form id="loginForm">

            <label>
                Usuário
            </label>

            <input
                type="text"
                id="usuario"
                placeholder="Seu nome"
                required
            >


            <label>
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="A senha é especial..."
                required
            >


            <button type="submit">
                Entrar no meu coração ❤️
            </button>

            <div id="erro"></div>

        </form>

    </div>

</div>



<!-- ==================================
     TELA DO AMOR
================================== -->

<div id="loveScreen">

    <div class="centerGlow"></div>


    <!-- partículas -->

    <div class="spark" style="left:12%;top:20%;animation-delay:.5s"></div>
    <div class="spark" style="left:25%;top:65%;animation-delay:1.8s"></div>
    <div class="spark" style="left:75%;top:20%;animation-delay:2.2s"></div>
    <div class="spark" style="left:88%;top:60%;animation-delay:1s"></div>
    <div class="spark" style="left:18%;top:45%;animation-delay:2.7s"></div>
    <div class="spark" style="left:82%;top:42%;animation-delay:1.5s"></div>


    <!-- corações -->

    <div class="floating" style="left:7%;animation-delay:0s">♥</div>
    <div class="floating" style="left:18%;animation-delay:2s">♡</div>
    <div class="floating" style="left:31%;animation-delay:4s">♥</div>
    <div class="floating" style="left:48%;animation-delay:1s">♡</div>
    <div class="floating" style="left:65%;animation-delay:3s">♥</div>
    <div class="floating" style="left:80%;animation-delay:5s">♡</div>
    <div class="floating" style="left:92%;animation-delay:2.5s">♥</div>


    <!-- ==================================
         CORAÇÃO PRINCIPAL
    ================================== -->

    <div class="heartArea" id="heartArea">


        <svg
            class="heartSvg"
            viewBox="0 0 512 512"
            xmlns="http://www.w3.org/2000/svg"
        >


            <defs>


                <!-- degradê do contorno -->

                <linearGradient
                    id="heartGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%"
                >

                    <stop
                        offset="0%"
                        stop-color="#ff2f7d"
                    />

                    <stop
                        offset="45%"
                        stop-color="#ff7eb6"
                    />

                    <stop
                        offset="75%"
                        stop-color="#e34cff"
                    />

                    <stop
                        offset="100%"
                        stop-color="#ff2f7d"
                    />

                </linearGradient>


                <!-- degradê interno -->

                <radialGradient
                    id="fillGradient"
                    cx="50%"
                    cy="40%"
                    r="65%"
                >

                    <stop
                        offset="0%"
                        stop-color="#ff5c9d"
                    />

                    <stop
                        offset="60%"
                        stop-color="#ff246f"
                    />

                    <stop
                        offset="100%"
                        stop-color="#9d1fff"
                    />

                </radialGradient>


                <!-- filtro neon -->

                <filter
                    id="glow"
                    x="-100%"
                    y="-100%"
                    width="300%"
                    height="300%"
                >

                    <feGaussianBlur
                        stdDeviation="7"
                        result="blur"
                    />

                    <feMerge>

                        <feMergeNode
                            in="blur"
                        />

                        <feMergeNode
                            in="SourceGraphic"
                        />

                    </feMerge>

                </filter>

            </defs>


            <!-- preenchimento -->

            <path
                class="heartFill"
                d="
                    M256 455
                    C235 435 100 330 55 235
                    C15 150 60 65 145 65
                    C198 65 230 96 256 135
                    C282 96 314 65 367 65
                    C452 65 497 150 457 235
                    C412 330 277 435 256 455Z
                "
            />


            <!-- segundo brilho -->

            <path
                class="heartOutline neonGlow"
                d="
                    M256 455
                    C235 435 100 330 55 235
                    C15 150 60 65 145 65
                    C198 65 230 96 256 135
                    C282 96 314 65 367 65
                    C452 65 497 150 457 235
                    C412 330 277 435 256 455Z
                "
            />


            <!-- linha interna -->

            <path
                class="heartInner"
                d="
                    M256 435
                    C232 415 120 325 82 240
                    C50 167 87 94 151 94
                    C198 94 229 127 256 165
                    C283 127 314 94 361 94
                    C425 94 462 167 430 240
                    C392 325 280 415 256 435Z
                "
            />

        </svg>


        <div class="insideText">

            <span class="small">
                MEU AMOR
            </span>

            <span class="big">
                TE<br>
                AMO ❤️
            </span>

        </div>

    </div>


    <!-- mensagem -->

    <div class="message">

        <h1>
            Você me faz feliz todos os dias.
        </h1>

        <p>
            E eu escolheria você de novo. Sempre. 💕
        </p>

    </div>

</div>



<script>


/* ==================================
   LOGIN
================================== */

const form =
    document.getElementById("loginForm");

const loginScreen =
    document.getElementById("loginScreen");

const loveScreen =
    document.getElementById("loveScreen");

const erro =
    document.getElementById("erro");


form.addEventListener("submit", function(event) {

    event.preventDefault();


    const usuario =
        document
        .getElementById("usuario")
        .value
        .trim();

    const senha =
        document
        .getElementById("senha")
        .value;


    /* LOGIN */

    if (
        usuario === "Jheneffer" &&
        senha === "teamo"
    ) {

        loginScreen.style.display =
            "none";

        loveScreen.style.display =
            "block";

        iniciarCoracoes();

    } else {

        erro.textContent =
            "Essa não é a senha, meu amor ❤️";

    }

});



/* ==================================
   CORAÇÕES EXTRAS
================================== */

function iniciarCoracoes() {

    for (
        let i = 0;
        i < 16;
        i++
    ) {

        const heart =
            document.createElement("div");

        heart.className =
            "floating";

        heart.innerHTML =
            Math.random() > .5
            ? "♥"
            : "♡";


        heart.style.left =
            Math.random() * 100 + "%";


        heart.style.fontSize =
            14 +
            Math.random() * 30 +
            "px";


        heart.style.animationDuration =
            5 +
            Math.random() * 8 +
            "s";


        heart.style.animationDelay =
            Math.random() * 7 +
            "s";


        loveScreen.appendChild(
            heart
        );

    }

}



/* ==================================
   INTERAÇÃO COM O CORAÇÃO
================================== */

const heartArea =
    document.getElementById(
        "heartArea"
    );


heartArea.addEventListener(
    "click",
    function() {


        /* onda */

        const ripple =
            document.createElement(
                "div"
            );

        ripple.className =
            "ripple";

        loveScreen.appendChild(
            ripple
        );


        setTimeout(
            function() {

                ripple.remove();

            },
            1200
        );


        /* explosão */

        for (
            let i = 0;
            i < 24;
            i++
        ) {

            const heart =
                document.createElement(
                    "div"
                );

            heart.className =
                "burst";


            heart.innerHTML =
                Math.random() > .5
                ? "❤️"
                : "💗";


            const angle =
                Math.random()
                * Math.PI
                * 2;


            const distance =
                100 +
                Math.random() * 230;


            heart.style.setProperty(
                "--x",
                Math.cos(angle)
                * distance
                + "px"
            );


            heart.style.setProperty(
                "--y",
                Math.sin(angle)
                * distance
                + "px"
            );


            loveScreen.appendChild(
                heart
            );


            setTimeout(
                function() {

                    heart.remove();

                },
                1400
            );

        }

    }
);


</script>

</body>
</html>
